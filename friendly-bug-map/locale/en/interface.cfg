[mod-setting-description]
fbm-preset=Low load / Balanced / Detailed values (vision ticks, marker ticks, scan ticks, work/tick): 300/300/18000/8, 120/120/7200/32, 60/60/3600/64. Custom uses the four controls below.
fbm-vision=Minimum ticks between starts of chart passes.
fbm-markers=Minimum ticks between starts of marker passes.
fbm-scan=Ticks to rest after scanning allowed generated chunks for silent spawns and ownership changes.
fbm-budget=Per tick in each lane: chunks searched, returned entities indexed, known entities sampled, chart candidates applied, or tag records processed. An engine chunk search returns all matching entities at once.
fbm-show=Server-wide master switch for Bug Manager overlays. Discovery and refresh follow each rule.
fbm-group=Group by proximity within each source, receiving force, surface and kind.
fbm-cell=Join a nearby anchor within this many tiles. Existing members get a 12.5% release margin.
fbm-cap=Maximum displayed markers per receiver and surface.
fbm-count=Display the number of charted members represented by each tag.
fbm-team=Include the contributing force name in marker text.
fbm-kind=Label groups with a prototype name or Mixed.
fbm-biters=Default for rules inheriting entity filters.
fbm-spitters=Default for rules inheriting entity filters.
fbm-other=Includes modded soldiers implemented as units.
fbm-nests=Track stationary unit-spawner entities.
fbm-worms=Automatically include only the four vanilla worm prototypes.
fbm-platform=Default for rules inheriting surface filters.
fbm-sandbox=Name fallback for Blueprint Sandboxes; see guide.
fbm-generate=Allow chart requests on ungenerated chunks inside a discovery radius.
fbm-debug=Print pass completion ticks to the server log.

