heading_overview=What Bug Manager tracks
text_overview=Follow another team’s bugs on your map. Nearby bugs share a marker, and their surroundings can be discovered or refreshed for the team receiving the information. Tracking leaves the bugs under their existing orders.
heading_first_steps=Start here
text_first_steps=Playing on a configured server? Open the map and look for the biter button in the shared mod toolbar. Open Map controls in this guide to learn how to find a group. Setting up a new save? Open Sharing rules (admins) to create the first rule.

heading_personal=Show or hide your details
text_personal=In remote map view, click the biter button in the mod toolbar. 1 shows Bug Manager’s icons and counts, and 0 hides them for you. Teammates keep their own choice. Normal Factorio map blips, team discovery and map refresh continue.
heading_locate=Find a particular swarm
text_locate=Type /bug-map reset-ui to open or centre your marker panel. Choose a group on your current surface, then click Locate group. The largest groups appear first. For example, Fox Swarm · 237 bugs is a group of 237 charted bugs. Locating requires the usual remote-view permission.
heading_chart=Read the map
text_chart=Markers and terrain update periodically. Discovered terrain stays on the team’s map after the swarm moves. Zoomed-in live viewing still needs normal Factorio visibility.

heading_create_rule=Create your first rule
text_create_rule=As an admin, type /bug-map config and choose Add rule. Select the team that owns the bugs as Source force and the team that needs the map as Receiving force. Choose the outputs you want, then click Apply. Fresh saves start with no rules. Use teams that already exist in your save.
heading_direction=Choose what gets shared
text_direction=Show markers draws the overlay. Discover terrain reveals new map chunks near eligible bugs. Refresh discovered terrain updates chunks already on the receiving team’s map. Sharing is one-way unless you tick Share in both directions. Swap forces reverses the draft before you apply it.
heading_display=Change what your team sees
text_display=Open the Bug Manager shortcut beside the hotbar. If it is hidden, pin it from the shortcut bar’s menu, or use /bug-map config and choose Marker settings. Select a source team to filter it or give it a map name such as Fox Swarm. Clear the name to use the team name again. Display presets, source filters and nest visibility affect the receiving team.

heading_select_surfaces=Pick surfaces in the rule editor
text_select_surfaces=Edit a sharing rule and tick Override surface filters. Choose Allowlist to track only the surfaces you tick, or Blocklist to skip them. An empty allowlist tracks nowhere. All uses every surface subject to the platform and sandbox exclusions.
heading_future=Include a future planet
text_future=Surface names (advanced) accepts comma-separated exact names, including surfaces that will be created later. Read the draft summary, then click Apply to save or Cancel to discard your changes.
heading_entities=Include modded bugs or exclude other units
text_entities=Enable Override default entity filters to choose categories for one rule. Other units includes compatible modded creatures and can also include soldiers. Use Exclude prototypes for exact internal names you want to omit. To show nests, enable nest tracking in the sharing rule and Show tracked nests in the team panel.

heading_missing=Check who can see the icons
text_missing=Open /bug-map reset-ui. Check your personal toggle, the receiving team’s Show bug icons setting and any filtered source teams. An admin can check the server-wide Show bug markers setting and confirm a rule shares markers with your team on this surface.
heading_cap=Check the marker limit
text_cap=If the panel reports groups hidden by the marker limit, the largest eligible groups get the available slots on this surface. Eligible bugs can still reveal terrain even when their marker is hidden. An admin can adjust the marker cap or the receiving team’s display preset.
heading_updates=Check when tracking last ran
text_updates=The panel shows the last update age in simulation seconds. A busy server may take longer to finish a pass. Admins can use /bug-map status to check rules and progress, /bug-map refresh to queue an update, or /bug-map on to resume stopped tracking.
