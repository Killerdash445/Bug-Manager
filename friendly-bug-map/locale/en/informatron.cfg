heading_overview=Follow your swarm
text_overview=A marker such as [font=default-semibold]Fox Swarm: 237 bugs[/font] shows how many nearby bugs share that icon. The name identifies their source team or its custom map name. Bug Manager follows the swarm as it moves and keeps its existing orders intact.
heading_first_steps=Playing on a server?
text_first_steps=Open remote map view and look for the biter in the shared mod toolbar. Click it to hide or show details for yourself. See [font=default-semibold]My map[/font] to find a particular group.
heading_admin_start=Setting up a new save?
text_admin_start=Fresh installations start with no sharing rules. As an admin, open the Bug Manager shortcut beside the hotbar and choose [font=default-semibold]Add first sharing rule[/font]. The Sharing rules page walks through a one-way example.

heading_personal=One button, just for your map
text_personal=[img=entity/small-biter]  [font=default-semibold]Plain biter · details on.[/font] Click to hide Bug Manager’s icons, names and counts.\n[img=fbm-map-details-hidden]  [font=default-semibold]Crossed-out biter · details off.[/font] Click again to show the icons your team receives.\n\nYour choice survives reconnects. Teammates keep their own view. Ordinary Factorio blips, terrain discovery and map refresh continue.
heading_locate=Find a group on this surface
text_locate=Open the marker panel with /bug-map reset-ui. Under [font=default-semibold]Find a group[/font], type a source team or its custom map name. Choose a result and click [font=default-semibold]Locate group[/font] to centre remote view. Larger groups appear first. Clear the search to see all available groups on this surface.
heading_chart=Read a last known position
text_chart=Markers update periodically. The group finder uses charted positions and your normal remote-view permissions. Discovered terrain stays on the map after the bugs move. Zoomed-in live viewing still needs normal Factorio visibility.

heading_create_rule=Choose the source and receiver
text_create_rule=As an admin, open Bug Manager beside the hotbar. Choose [font=default-semibold]Add first sharing rule[/font], or [font=default-semibold]Sharing rules → Add rule[/font] if rules already exist. You can also open the rule list with /bug-map config.
heading_example=Example · Swarm → Builders
text_example=For Source force, pick the team that owns the bugs. For Receiving force, pick the team that should see them. With Swarm as the source and Builders as the receiver, Builders gets information from Swarm’s eligible bugs. Tick [font=default-semibold]Share in both directions[/font] to share eligible bugs’ surroundings the other way as well.
heading_direction=Choose the outputs and apply
text_direction=[font=default-semibold]Show markers[/font] draws bug icons and labels.\n[font=default-semibold]Discover terrain[/font] charts new terrain around eligible bugs.\n[font=default-semibold]Refresh discovered terrain[/font] updates chunks the receiver has already charted.\n\nCheck the teams, direction, outputs and radius in the preview, then click Apply. Each rule can use a different combination.

heading_display=Open team display settings
text_display=As an admin, open Bug Manager beside the hotbar and tick [font=default-semibold]Expand team display settings[/font]. If the shortcut is unpinned, use the ⋮ menu beside the hotbar, or open /bug-map config and choose Marker settings. These choices affect everyone on the receiving team.
heading_presets=Pick a display preset
text_presets=[font=default-semibold]Minimal[/font] groups bugs and shows counts. [font=default-semibold]Balanced[/font] adds the source name. [font=default-semibold]Detailed[/font] shows individual units and their types. The server’s marker cap still applies. Choose Server settings to use the map’s defaults again.
heading_source=Filter a source or give it a name
text_source=Select a source team. Untick [font=default-semibold]Show icons from selected source[/font] to hide that source for the receiving team. To rename its labels, type a Map name such as Fox Swarm and click Apply name. Apply a blank name to use the team name again. To see names, use a preset with source labels enabled.

heading_select_surfaces=Limit a rule to particular surfaces
text_select_surfaces=In Advanced filters, the disabled platform and sandbox boxes show the map defaults. Tick [font=default-semibold]Override surface filters[/font] to use this rule’s own choices. Allowlist tracks only the selected surfaces. Blocklist skips the selected surfaces. All includes every surface that passes the platform and sandbox exclusions. An empty allowlist tracks nowhere.
heading_future=Add a planet before it exists
text_future=Enter its exact internal surface name in Surface names (advanced). Separate multiple names with commas. Check the surface summary, then click Apply. If a named surface is created later, the rule can match it.
heading_entities=Choose creatures, nests and worms
text_entities=With the entity override off, the disabled boxes show the map defaults. Enable [font=default-semibold]Override default entity filters[/font] to change categories for this rule. Other units can include modded bugs or soldiers. Exclude prototypes accepts exact internal names. For nest icons, enable spawner tracking in the rule or map defaults and Show tracked nests in team display settings.

heading_missing=I see ordinary blips but no labels
text_missing=Open remote map view and check the biter button. If it is crossed out, click it. If the plain biter is already showing, open /bug-map reset-ui and read the status. An admin can check the server’s Show bug markers switch, the receiving team settings, and whether an enabled rule shares markers on this surface.
heading_cap=Some groups are missing
text_cap=Check the current surface, clear your group search and read any marker-limit message. Larger groups get the available slots first. Eligible bugs beyond the cap can still reveal terrain. With individual markers, there are no grouped entries to locate. Also check whether a source is filtered out.
heading_updates=Positions look old
text_updates=Read Last update in the marker panel. It measures simulation seconds since the last completed update. On a busy server, a pass can take longer. Admins can inspect /bug-map status, use /bug-map refresh to queue a pass or /bug-map on to resume stopped tracking.
