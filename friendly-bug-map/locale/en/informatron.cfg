menu_map_controls=My map
title_map_controls=Show, hide and locate swarms
menu_sharing=Sharing rules
title_sharing=Set up team sharing
menu_team_display=Team display
title_team_display=Choose what your team sees
menu_marker_style=Marker styles
title_marker_style=Style your team's markers
menu_surfaces=Surfaces and units
title_surfaces=Choose where and what to track
menu_troubleshooting=Missing markers
title_troubleshooting=Find a missing swarm

intro_intro=A marker such as Fox Swarm: 237 bugs shows where a group was last seen together. The bugs keep their existing orders.
heading_start=Where to start
term_player=Player
text_player=Open remote map view. Click the biter in the shared mod toolbar to show or hide details on your map.
term_admin=Admin
text_admin=Open Bug Manager beside the hotbar to set up sharing. Pin it from the ⋮ menu if needed. A fresh save starts with no rules.
heading_map_reading=Reading the map
text_map_reading=Clusters share an icon. Discovered terrain stays charted after a swarm moves away.

intro_personal=The map button controls your own view. Your choice survives reconnects.
heading_button=Map toolbar
term_shown=[img=entity/small-biter]  Plain biter
text_shown=Details are visible. Click to hide icons, names and counts.
term_hidden=[img=fbm-map-details-hidden]  Crossed-out biter
text_hidden=Details are hidden. Click to show your team's markers again. Teammates, terrain updates and ordinary map blips keep working.
heading_locate=Find a group
text_locate=Use /bug-map reset-ui to open or centre the panel. Search by source team or map name, select a result and click Locate group. Larger groups appear first.
heading_position=Last known position
text_position=Results use the surface you are viewing and positions your team has charted. Zoomed-in live viewing requires normal Factorio visibility.

intro_first_rule=Admins can open the rule list with /bug-map config, or choose Add first sharing rule from the hotbar shortcut.
heading_direction=Swarm → Builders
text_direction=Set Swarm as the source force and Builders as the receiving force. Use teams from your save. Enable Share in both directions only if both teams should receive updates.
heading_outputs=Choose the outputs
term_markers=Show markers
text_markers=Draw eligible bug icons and labels.
term_discover=Discover terrain
text_discover=Chart new ground around eligible bugs.
term_refresh=Refresh terrain
text_refresh=Update nearby chunks the receiver has already charted.
heading_apply=Apply the rule
text_apply=Check the teams and radius in the preview, then click Apply. For another source or receiver, choose Sharing rules → Add rule.

intro_team_controls=Admins can expand team display settings in the hotbar panel. Changes apply to the receiving team.
heading_presets=Display presets
term_minimal=Minimal
text_minimal=Group nearby bugs and show counts.
term_balanced=Balanced
text_balanced=Group nearby bugs and add the source name.
term_detailed=Detailed
text_detailed=Show individual units and their types. The server's marker cap still applies.
heading_source=Choose a source
text_source=Select a team and untick Show icons from selected source to hide its markers. Choose Server settings in the preset list to inherit the map defaults.
heading_example_name=Give a swarm a name
text_example_name=Enter Fox Swarm under Map name and click Apply name. Use a preset with source names enabled. Apply a blank name to restore the team name.

intro_style=Set thresholds and reserved nest slots per receiving team. Use Apply marker limits to save them.
heading_counts=Marker limits
term_icon_min=Show icons from
text_icon_min=Use 1 to keep lone scouts visible. A higher value hides smaller bug groups. Discovery and refresh continue.
term_label_min=Show labels from
text_label_min=Use 10 to leave groups of 1–9 as icons with no map text. The group finder still shows their exact counts. Individual markers count as one bug.
term_nest_slots=Nest slots
text_nest_slots=Reserve slots on each surface within the cap. Other groups can use unused slots. Enable spawner tracking and Show tracked nests first.
heading_identity=Prefix and text colour
text_identity=Select the source team and enter up to 12 prefix characters. For colour, use #RRGGBB such as #FFD166. Click Apply label style. Clear either field to restore its default.
heading_example_style=Example
text_example_style=[img=entity/small-biter]  [color=#FFD166]N · Fox Swarm: 237 bugs[/color]\nThis source uses prefix N, map name Fox Swarm and label colour #FFD166.

intro_filters=In the sharing rule, open Advanced filters. Enable an override to edit this rule's choices. Otherwise the rule inherits the map defaults.
heading_surfaces=Surface mode
term_all=All
text_all=Track every surface that passes platform and sandbox exclusions.
term_allow=Allowlist
text_allow=Track only the named surfaces. An empty list tracks nowhere.
term_block=Blocklist
text_block=Skip the named surfaces.
heading_future=Plan for a new planet
text_future=Enter exact internal names in Surface names (advanced), separated by commas. A rule can match a surface created later.
heading_creatures=Units, nests and worms
text_creatures=Other units can include modded bugs or soldiers. Exclude prototypes accepts exact internal names. Nests also require spawner tracking and the receiving team's Show tracked nests switch.

intro_diagnose=Open /bug-map reset-ui on the affected surface. Check visibility, Last update and any marker-limit message.
heading_labels=Blips or icons without labels
text_labels=Click the map button if the biter is crossed out. An admin can check the server marker switch, the incoming rule, team source filters and the minimum bug count for labels.
heading_missing_group=A group is missing
text_missing_group=Clear the search and check the surface. Individual mode has no groups to locate. Icon thresholds, reserved nest slots and the marker cap can affect which groups appear.
heading_late=Positions look old
text_late=Updates run periodically. Admins can check /bug-map status, use /bug-map refresh to queue a pass, or use /bug-map on to resume tracking.
